# Crea gli installer per Windows e macOS e li allega a una bozza di release.
#
# Si avvia pubblicando un tag di versione, ad esempio:
#   git tag v1.0.0
#   git push origin v1.0.0
# oppure a mano dalla scheda "Actions" di GitHub ("Run workflow").

name: Rilascio

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    name: Installer ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon e Intel)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Alexandria ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Scarica l'installer adatto al tuo computer:
            - **Windows**: il file `.exe`
            - **Mac**: il file `.dmg` (funziona su Apple Silicon e Intel)

            Al primo avvio il sistema mostra un avviso perché l'app non è firmata:
            le istruzioni per superarlo sono in INSTALLAZIONE.md.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
