[package]
name = "alexandria"
version = "1.1.0"
description = "Alexandria — la tua biblioteca di articoli scientifici"
authors = ["Marco Torboli"]
edition = "2021"

[lib]
# Il suffisso `_lib` evita un conflitto di nomi con il binario su Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "alexandria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
ureq = { version = "3.4.2", features = ["json"] }
gethostname = "1.1.0"

[dev-dependencies]
tempfile = "3.27.0"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
